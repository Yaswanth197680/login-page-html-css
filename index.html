<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

          <title>Nexora | Sign In</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="page">

        <div class="login-card">


            <!-- =========================
                 LEFT SIDE
            ========================== -->

            <div class="left-panel">

                <div class="brand">

                    <div class="brand-icon">
                        ◈
                    </div>

                    <span>Nexora</span>

                </div>


                <div class="left-content">

                    <h1>
                        Everything you<br>
                        need, in one place.
                    </h1>
                    
                    <p>
                        Sign in to access Nexora, manage your account
                        and continue where you left off.
                    </p>

                </div>


                <div class="secure">

                    <span class="shield">◆</span>

                    <span>
                        Secure &amp; private
                    </span>

                </div>

            </div>



            <!-- =========================
                 RIGHT SIDE
            ========================== -->

            <div class="right-panel">

                <div class="form-container">

                    <h2>
                        Welcome back
                    </h2>

                    <p class="description">
                        Please enter your details to sign in.
                    </p>


                    <!-- EMAIL -->

                    <div class="input-group">

                        <label for="email">
                            Email address
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                ✉
                            </span>

                            <input
                                type="email"
                                id="email"
                                placeholder="you@example.com"
                                required
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required
                            >

                        </div>

                    </div>


                    <!-- REMEMBER + FORGOT -->

                    <div class="options">

                        <label class="remember">

                            <input type="checkbox">

                            <span>
                                Remember me
                            </span>

                        </label>


                        <a href="#">
                            Forgot password?
                        </a>

                    </div>


                    <!-- SIGN IN BUTTON -->

                    <button class="signin-btn">

                        <span>
                            Sign in
                        </span>

                        <span class="arrow">
                            →
                        </span>

                    </button>


                    <!-- DIVIDER -->

                    <div class="divider">

                        <span></span>

                        <p>
                            New here?
                        </p>

                        <span></span>

                    </div>


                    <!-- CREATE ACCOUNT -->

                    <p class="create-account">

                        Don't have an account?

                        <a href="#">
                            Create an account
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
